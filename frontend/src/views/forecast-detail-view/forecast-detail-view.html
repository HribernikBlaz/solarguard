<p><a routerLink="/napoved">← Vsi sistemi</a></p>
<div class="page-head">
  <h1>Napoved proizvodnje</h1>
  <label>
    Število dni
    <select [ngModel]="days()" (ngModelChange)="days.set($event)">
      @for (n of [3, 5, 7, 14]; track n) {
        <option [ngValue]="n">{{ n }}</option>
      }
    </select>
  </label>
</div>
@if (error()) {
  <p class="error">{{ error() }}</p>
}
@if (installation(); as i) {
  <app-forecast-card [installation]="i" [days]="days()" />
} @else if (!error()) {
  <p class="muted">Nalagam ...</p>
}
<p class="muted">
  Napoved sevanja na nagnjeno ploskev (30°, jug) za lokacijo sistema: Open-Meteo (open-meteo.com). Pričakovana proizvodnja = sevanje × nazivna moč × 0,8.
</p>
