services:
  device-db:
    image: hribernikblaz/solarguard-device-db:1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - device-db-data:/var/lib/postgresql/data
    networks:
      - device-net

  device-api:
    image: hribernikblaz/solarguard-device-api:1.0
    depends_on:
      - device-db
    restart: on-failure
    environment:
      ConnectionStrings__Default: Host=device-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8081:8080"
    networks:
      - device-net

networks:
  device-net:

volumes:
  device-db-data:
